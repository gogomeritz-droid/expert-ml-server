services:
  - type: web
    name: roblox-ml-balance-server
    env: python
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        value: "#1480epvp+6q9=07"
      - key: PYTHON_VERSION
        value: 3.11.9
